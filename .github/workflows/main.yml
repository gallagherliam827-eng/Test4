name: Build Manga Translator APK
on: [push, workflow_dispatch]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: rm -rf _app && mkdir -p _app
      - run: echo -n "" >> _app/p.b64
      - run: echo -n "" >> _app/p.b64
      - run: echo -n "" >> _app/p.b64
      - run: echo -n "" >> _app/p.b64
      - run: echo -n "" >> _app/p.b64
      - run: echo -n "" >> _app/p.b64
      - run: cd _app && base64 -d p.b64 | tar -xJf - && rm -f p.b64 && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: _app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
